[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whyskill"
version = "0.1.0"
description = "Find Claude Code skills that fail silently - never loaded, never chosen, or shadowed by another skill."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "claude",
    "claude-code",
    "agent-skills",
    "skill",
    "linter",
    "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately empty: whyskill must run anywhere `python3` runs, including a
# bare CI container. The frontmatter reader is first-party for the same reason
# it is not PyYAML - it has to reproduce Claude Code's loader, not YAML's.
dependencies = []

[project.urls]
Homepage = "https://github.com/hjalti-hub/claude-skill"
Issues = "https://github.com/hjalti-hub/claude-skill/issues"

[project.scripts]
whyskill = "whyskill.cli:main"

[tool.setuptools.packages.find]
include = ["whyskill*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
