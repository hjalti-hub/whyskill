name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  dogfood:
    # whyskill has to survive its own examples, or the examples are lying.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The good example must be clean
        run: python -m whyskill examples/good --no-personal --no-plugins --fail-on note

      - name: The broken examples must still be broken
        run: |
          if python -m whyskill examples/broken --no-personal --no-plugins; then
            echo "::error::examples/broken produced no findings; the examples have rotted"
            exit 1
          fi

      - name: SARIF output must be well-formed
        run: |
          python -m whyskill examples/broken --no-personal --no-plugins \
            --sarif --fail-on never > whyskill.sarif
          python -c "import json,sys; d=json.load(open('whyskill.sarif')); \
            assert d['version']=='2.1.0'; assert d['runs'][0]['results']; \
            print(len(d['runs'][0]['results']), 'results')"

      - name: Install as a package and run the entry point
        run: |
          pip install .
          whyskill --version
          whyskill examples/good --no-personal --no-plugins

      - name: The shipped skill must pass its own checks
        run: whyskill .claude/skills --no-personal --no-plugins --target spec --fail-on warning

      - name: The hook must report a broken skill to Claude (exit 2)
        run: |
          payload='{"hook_event_name":"PostToolUse","tool_name":"Write","cwd":"'$PWD'","tool_input":{"file_path":"'$PWD'/examples/broken/dead-skill/SKILL.md"}}'
          set +e
          echo "$payload" | whyskill hook 2>hook.err
          code=$?
          set -e
          test "$code" -eq 2 || { echo "::error::expected exit 2, got $code"; exit 1; }
          grep -q INVOKE001 hook.err || { echo "::error::finding missing from stderr"; exit 1; }

      - name: The hook must stay silent on a healthy skill
        run: |
          payload='{"hook_event_name":"PostToolUse","tool_name":"Write","cwd":"'$PWD'","tool_input":{"file_path":"'$PWD'/examples/good/summarize-diff/SKILL.md"}}'
          out=$(echo "$payload" | whyskill hook)
          test -z "$out" || { echo "::error::hook spoke when nothing was wrong: $out"; exit 1; }

      - name: The hook must survive garbage without breaking a session
        run: |
          for junk in '' 'not json' '[]' '{"broken":'; do
            printf '%s' "$junk" | whyskill hook || {
              echo "::error::hook exited non-zero on input: $junk"; exit 1; }
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install ruff
      - run: ruff check whyskill tests
      - run: ruff format --check whyskill tests
